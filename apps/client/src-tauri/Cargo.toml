[package]
name = "contractplay"
version = "0.1.2"
description = "Play, learn, and review contract bridge"
authors = ["ContractPlay contributors"]
license = "MIT"
repository = "https://github.com/irom77/ContractPlay"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "contractplay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
