<svg xmlns="http://www.w3.org/2000/svg" width="760" height="180" viewBox="0 0 760 180" role="img" aria-labelledby="title desc">
  <title id="title">ContractPlay</title>
  <desc id="desc">A teal bridge arch connects four playing cards above the ContractPlay wordmark.</desc>
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12384a"/>
      <stop offset="1" stop-color="#102b3b"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ce0c3"/>
      <stop offset="1" stop-color="#40bfa9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#071b29" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="752" height="172" rx="30" fill="url(#felt)"/>
  <g filter="url(#shadow)" transform="translate(48 39)">
    <rect x="9" y="21" width="66" height="91" rx="10" fill="#f7f5ee" transform="rotate(-13 42 66)"/>
    <rect x="93" y="21" width="66" height="91" rx="10" fill="#f7f5ee" transform="rotate(13 126 66)"/>
    <text x="33" y="57" fill="#d25462" font-family="Georgia,serif" font-size="25" font-weight="700">♥</text>
    <text x="121" y="57" fill="#172c3b" font-family="Georgia,serif" font-size="25" font-weight="700">♠</text>
    <path d="M25 107 Q84 33 143 107" fill="none" stroke="url(#bridge)" stroke-width="9" stroke-linecap="round"/>
    <path d="M34 108v17m100-17v17M24 126h120" fill="none" stroke="#7ce0c3" stroke-width="4" stroke-linecap="round"/>
    <circle cx="84" cy="78" r="6" fill="#f3ca78"/>
  </g>
  <text x="258" y="104" fill="#f7f5ee" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="53" font-weight="750" letter-spacing="-2">Contract<tspan fill="#7ce0c3">Play</tspan></text>
  <text x="261" y="134" fill="#b8cbd1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" letter-spacing="3.1">PLAY · LEARN · REVIEW</text>
</svg>
