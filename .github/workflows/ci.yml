name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/verify-web-build.mjs

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: msi,nsis
          - os: macos-latest
            bundles: app,dmg
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Build Windows and macOS installers
        run: pnpm --filter @contractplay/client exec tauri build --bundles "${{ matrix.bundles }}" --ci
      - uses: actions/upload-artifact@v4
        with:
          name: ContractPlay-${{ matrix.os }}
          path: apps/client/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    name: iOS and iPadOS simulator build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Xcode and CocoaPods
        run: |
          xcodebuild -version
          if ! command -v pod >/dev/null 2>&1; then brew install cocoapods; fi
          pod --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Generate the Xcode project
        run: pnpm --filter @contractplay/client exec tauri ios init --ci
      - name: Build the iOS simulator app
        run: pnpm --filter @contractplay/client exec tauri ios build --target aarch64-sim --debug
      - name: Locate simulator app bundle
        id: simulator-app
        shell: bash
        run: |
          app_path="$(find apps/client/src-tauri/gen/apple/build -type d -name '*.app' -path '*iphonesimulator*' -print -quit)"
          test -n "$app_path"
          echo "path=$app_path" >> "$GITHUB_OUTPUT"
      - name: Install and launch on an iPad simulator
        shell: bash
        run: |
          simulator_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((x["udid"] for runtime, devices in d["devices"].items() if "iOS" in runtime for x in devices if x.get("isAvailable") and "iPad" in x.get("deviceTypeIdentifier", "")), ""))')"
          test -n "$simulator_id"
          xcrun simctl boot "$simulator_id" 2>/dev/null || true
          xcrun simctl bootstatus "$simulator_id" -b
          xcrun simctl install "$simulator_id" "${{ steps.simulator-app.outputs.path }}"
          xcrun simctl launch "$simulator_id" com.contractplay.bridge
          mkdir -p artifacts
          xcrun simctl io "$simulator_id" screenshot artifacts/ContractPlay-iPad.png
      - uses: actions/upload-artifact@v4
        with:
          name: ContractPlay-iOS-iPadOS-simulator
          path: |
            ${{ steps.simulator-app.outputs.path }}
            artifacts/ContractPlay-iPad.png
          if-no-files-found: error
          retention-days: 14
